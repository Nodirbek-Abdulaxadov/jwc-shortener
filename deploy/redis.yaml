# Reference manifests — copy into `musanna-soft/k8s-gitops` under
# `apps/jwc-shortener/`. They are kept here because this repo is where the
# dependency is declared (`main.jwc` imports `redis`), and a reader asking
# "what does this app need to run correctly" should find the answer next to
# the code rather than in another repository.
#
# Nothing in this directory is applied by CI. The deploy workflow only bumps
# the image tag in `apps/jwc-shortener/deployment.yaml`.
#
# Without these, the app still runs: the `redis` package falls back to an
# in-process cache. What is lost is the thing the package exists for — a rate
# limit that holds across replicas instead of being `60 x replicas`.
---
apiVersion: v1
kind: Service
metadata:
  name: jwc-shortener-redis
  labels:
    app: jwc-shortener-redis
spec:
  # Headless is enough: one replica, addressed by name, no load balancing to
  # do. Cheaper than a ClusterIP and it makes the single-instance assumption
  # explicit rather than implied.
  clusterIP: None
  selector:
    app: jwc-shortener-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwc-shortener-redis
  labels:
    app: jwc-shortener-redis
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two Redis pods would split the rate-limit
  # counters between them for the length of the rollout, which is the exact
  # failure this replaces. A few seconds of fallback-to-in-process during a
  # restart is the better trade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jwc-shortener-redis
  template:
    metadata:
      labels:
        app: jwc-shortener-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            # No persistence. These are 60-second rate-limit counters; an
            # fsync per INCR buys nothing, and losing them on restart costs
            # one window.
            - redis-server
            - --appendonly
            - "no"
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 96Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Add to the app container's `env:` in apps/jwc-shortener/deployment.yaml.
#
# The app reads this at boot and fails fast on a malformed URL, rather than
# letting every request rediscover the typo. Verify it took effect on
# `/metrics`: the `jwc_redis_pool_*` series appear only when Redis is really
# configured — absent means the app is silently on the in-process fallback.
#
#   env:
#     - name: JWC_REDIS_URL
#       value: redis://jwc-shortener-redis:6379
#
# `rediss://` instead if the cluster ever puts TLS in front of it; the driver
# ships webpki roots, so no trust-store mounting is needed.
